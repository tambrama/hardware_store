services:
  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "yes"]

  kafka:
    image: redpandadata/redpanda:latest
    container_name: kafka
    ports:
      - "9092:9092" 
      - "9093:9093"
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:9093 
      - --advertise-kafka-addr
      - PLAINTEXT://kafka:9092,OUTSIDE://host.docker.internal:9093

  db-shopapi:
    image: postgres:15-alpine
    container_name: db-shopapi
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shopapi
    volumes:
      - db-shopapi:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5
    ports:
      - "5432:5432"

  db-photos:
    image: postgres:15-alpine
    container_name: db-photos
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - db-photos:/var/lib/postgresql/data
      - ./docker/photos-postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    ports:
      - "5434:5432"

  db-hardwarestore: 
    image: postgres:16-alpine
    container_name: db-hardwarestore
    env_file:
      - ./hardware_store/.env
    environment:
      POSTGRES_DB: hardwarestore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hardwarestore"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - db-hardwarestore:/var/lib/postgresql/data

  migration:
    build:
      context: ./
      dockerfile: hardware_store/build/migrator/Dockerfile
    env_file:
      - hardware_store/.env
    command:
      - sh
      - -c
      - |
        goose -dir migrations postgres \
          "host=db-hardwarestore port=5432 user=$$PSQL_USER password=$$PSQL_PASSWORD dbname=$$PSQL_NAME sslmode=disable" \
          up
    depends_on:
      db-hardwarestore:
        condition: service_healthy

  app-main:
    build:
      context: ./
      dockerfile: hardware_store/build/server/Dockerfile
    container_name: app-main
    expose:
      - "8081"
    env_file:
      - ./hardware_store/.env
    environment:
      - SERVER_PORT=8081
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${PSQL_USER}
      - DB_PASSWORD=${PSQL_PASSWORD}
      - PHOTO_SERVICE_URL=http://photo-service:8000
    depends_on:
      migration:
        condition: service_completed_successfully
      db-hardwarestore:
        condition: service_healthy
      auth-service:
        condition: service_started

  app-read-1:
    build:
      context: ./
      dockerfile: hardware_store/build/server/Dockerfile
    container_name: app-read-1
    expose:
      - "8081"
    env_file:
      - ./hardware_store/.env
    environment:
      - SERVER_PORT=8081
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${PSQL_READ_USER}
      - DB_PASSWORD=${PSQL_READ_PASSWORD}
      - PHOTO_SERVICE_URL=http://photo-service:8000
    depends_on:
      migration:
        condition: service_completed_successfully
      db-hardwarestore:
        condition: service_healthy
      auth-service:
        condition: service_started

  app-read-2:
    build:
      context: ./
      dockerfile: hardware_store/build/server/Dockerfile
    container_name: app-read-2
    expose:
      - "8081"
    env_file:
      - ./hardware_store/.env
    environment:
      - SERVER_PORT=8081
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${PSQL_READ_USER}
      - PHOTO_SERVICE_URL=http://photo-service:8000
      - DB_PASSWORD=${PSQL_READ_PASSWORD}
    depends_on:
      migration:
        condition: service_completed_successfully
      db-hardwarestore:
        condition: service_healthy
      auth-service:
        condition: service_started

  backend:
    build:
      context: ./
      dockerfile: store_python/Dockerfile
    container_name: backend
    env_file:
      - ./store_python/.env
    environment:
      PORT: 5000
      KAFKA_CONSUMER_ENABLED: "1"
    depends_on:
      db-shopapi:
        condition: service_healthy
      auth-service:
        condition: service_started
      redis:
        condition: service_started
      kafka:
        condition: service_started
      db-photos:
        condition: service_healthy

  backend-replica1:
    build:
      context: ./
      dockerfile: store_python/Dockerfile
    container_name: backend-replica1
    env_file:
      - ./store_python/.env
    environment:
      PORT: 5001
      KAFKA_CONSUMER_ENABLED: "0"
    depends_on:
      db-shopapi:
        condition: service_healthy
      backend:
        condition: service_started
      auth-service:
        condition: service_started
      redis:
        condition: service_started
      kafka:
        condition: service_started
      db-photos:
        condition: service_healthy

  backend-replica2:
    build:
      context: ./
      dockerfile: store_python/Dockerfile
    container_name: backend-replica2
    env_file:
      - ./store_python/.env
    environment:
      PORT: 5002
      KAFKA_CONSUMER_ENABLED: "0"
    depends_on:
      db-shopapi:
        condition: service_healthy
      backend:
        condition: service_started
      auth-service:
        condition: service_started
      redis:
        condition: service_started
      kafka:
        condition: service_started
      db-photos:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    expose:
      - "80"

  # ssl-init:
  #   image: alpine:3.19
  #   command: ["sh", "-c", "apk add --no-cache openssl && (test -f /ssl/shop.local.crt || openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout /ssl/shop.local.key -out /ssl/shop.local.crt -subj /CN=shop.local)"]
  #   volumes:
  #     - ./nginx/ssl:/ssl
  #   restart: "no"

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./static:/usr/share/nginx/html:ro
      - ./nginx/cache:/var/cache/nginx:rw
    depends_on:
      db-hardwarestore:
        condition: service_healthy
      db-shopapi:
        condition: service_healthy
      app-main:
        condition: service_started
      app-read-1:
        condition: service_started
      app-read-2:
        condition: service_started
      backend:
        condition: service_started
      backend-replica1:
        condition: service_started
      backend-replica2:
        condition: service_started
      pgadmin:
        condition: service_started
      # ssl-init:
      #   condition: service_completed_successfully
    restart: unless-stopped

  auth-migrations:
    build:
      context: ./auth-service
      dockerfile: build/server/Dockerfile
    container_name: auth-migrations
    environment:
      - STORAGE_PATH=/app/storage/auth.db
    volumes:
      - pg-auth:/storage
    entrypoint: ["/bin/goose"]
    command: ["-dir", "/app/migrations", "sqlite3", "/storage/auth.db", "up"]

  auth-service:
    build:
      context: ./auth-service
      dockerfile: build/server/Dockerfile
    container_name: auth-service
    ports:
      - "9090:9090"
    env_file:
      - ./auth-service/.env
    environment:
      - SERVER_PORT=9090
      - CONFIG_PATH=/app/config/local.yaml
      - STORAGE_PATH=/app/storage/auth.db
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - APP_SECRET=${APP_SECRET}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - OAUTH_JWT_EXPIRATION=${OAUTH_JWT_EXPIRATION}
    volumes:
      - pg-auth:/app/storage
    depends_on:
      auth-migrations:
        condition: service_completed_successfully

  photo-service:
    build:
      context: ./
      dockerfile: photo_service/Dockerfile
    container_name: photo-service
    environment:
      PHOTO_SHARD_0_DSN: ${PHOTO_SHARD_0_DSN}
      PHOTO_SHARD_1_DSN: ${PHOTO_SHARD_1_DSN}
      PHOTO_SHARD_2_DSN: ${PHOTO_SHARD_2_DSN}
      PHOTO_SHARD_3_DSN: ${PHOTO_SHARD_3_DSN}
    depends_on:
      db-photos:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  # 🆕 Event Generator — воркер для генерации событий об изменении товаров
  generator-service:
    build:
      context: ./
      dockerfile: generator-service/Dockerfile
    container_name: generator-service
    env_file:
      - .env
    environment:
      - CONFIG_PATH=/app/config/local.yaml
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC=product-updates
      - DB_HOST=db-hardwarestore
      - DB_PORT=5432
      - DB_USER=${PSQL_USER}
      - DB_PASSWORD=${PSQL_PASSWORD}
      - DB_NAME=hardwarestore
    volumes:
      - ./generator-service/config:/app/config:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db-hardwarestore:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped
  
volumes:
  db-shopapi:
  db-photos:
  db-hardwarestore:
  pg-auth:
  nginx_cache:
