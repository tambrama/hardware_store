events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;


    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static_cache:10m
                                                 max_size=1g inactive=60m use_temp_path=off;

    # Gzip 
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;
    gzip_disable "msie6";

    # Балансировка нагрузки - Hardware Store (соотношение 2:1:1)
    upstream backend_write {
        # server app-main:8081;
        zone backend_write 64k;
        server app-main:8081 resolve;
    }

    upstream backend_read {
        # server app-main:8081 weight=2;
        # server app-read-1:8081 weight=1;
        # server app-read-2:8081 weight=1;
        zone backend_read 64k;
        server app-main:8081 weight=2 resolve;
        server app-read-1:8081 weight=1 resolve;
        server app-read-2:8081 weight=1 resolve;
    }

    # Балансировка нагрузки - Store Python (соотношение 2:1:1)
    upstream python_write {
        # server backend:5000;
        zone python_write 64k;
        server backend:5000 resolve;
    }

    upstream python_read {
        # server backend:5000 weight=2;
        # server backend-replica1:5001 weight=1;
        # server backend-replica2:5002 weight=1;
        zone python_read 64k;
        server backend:5000 weight=2 resolve;
        server backend-replica1:5001 weight=1 resolve;
        server backend-replica2:5002 weight=1 resolve;
    }

    server {
        listen 80;
        listen 443 ssl;
        http2 on;
        server_name local.hardwarestore.com shop.local localhost;

        # SSL настройки
        ssl_certificate /etc/nginx/ssl/localhost.crt;
        ssl_certificate_key /etc/nginx/ssl/localhost.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Статус nginx
        location /status {
            stub_status on;
            allow all;
        }

        # Swagger UI - Hardware Store
        # location = /swagger {
        #     return 301 /swagger/;
        # }
        # Some swaggo/files builds don't ship swagger-ui-standalone-preset.js.
        # Provide a tiny compatibility shim so Swagger UI can initialize.
        # location = /swagger/swagger-ui-standalone-preset.js {
        #     default_type application/javascript;
        #     return 200 'window.SwaggerUIStandalonePreset = window.SwaggerUIStandalonePreset || { presets: [window.SwaggerUIBundle && window.SwaggerUIBundle.presets && window.SwaggerUIBundle.presets.apis].filter(Boolean), plugins: [window.SwaggerUIBundle && window.SwaggerUIBundle.plugins && window.SwaggerUIBundle.plugins.DownloadUrl].filter(Boolean) };';
        # }
        location /swagger/ {
            proxy_pass http://backend_read/swagger/index.html;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Swagger UI - Store Python (проксируем /api/v2/apidocs на /apidocs)
        location ~ ^/api/v2/apidocs/(.*)$ {
            proxy_pass http://python_read/apidocs/$1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Script-Name /api/v2/apidocs;
        }

        # Flasgger статические файлы (CSS, JS, etc)
        location ~ ^/api/v2/flasgger_static/(.*)$ {
            proxy_pass http://python_read/flasgger_static/$1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Apispec JSON с переписью пути - запрос идёт на /apispec_1.json но переписываем в /api/v2
        location /apispec_1.json {
            proxy_pass http://python_read/apispec_1.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Swagger JSON endpoint
        location /swagger.json {
            proxy_pass http://python_read/swagger.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Flasgger статические файлы (без префикса /api/v2)
        location /flasgger_static/ {
            proxy_pass http://python_read/flasgger_static/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Редирект с /api/v2/swagger на /api/v2/apidocs
        location = /api/v2/swagger/ {
            return 301 /api/v2/apidocs/;
        }

        # Редирект с /api/v1 на /swagger/
        location = /api/v1 {
            return 301 /swagger/;
        }

        # Редирект с /api/v1/ на /swagger/
        location = /api/v1/ {
            return 301 /swagger/;
        }

        # Редирект с /api/v2 на /api/v2/swagger/
        location = /api/v2 {
            return 301 /api/v2/swagger/;
        }

        # Редирект с /api/v2/ на /api/v2/swagger/
        location = /api/v2/ {
            return 301 /api/v2/swagger/;
        }

                # 🟢 Go: Native WebSocket endpoint
        location = /ws {
            proxy_pass http://backend_write/ws;
            
            # WebSocket headers
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Стандартные заголовки
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Таймауты для долгоживущих соединений
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # 🟢 Go: SSE endpoint
        location = /sse {
            proxy_pass http://backend_write/sse;
            
            # SSE: отключаем буферизацию
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Cache-Control no-cache;
            
            # Стандартные заголовки
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Таймауты
            proxy_read_timeout 86400s;
        }
        
        # API v1 - Hardware Store (GET запросы с балансировкой для чтения, остальное на write)
        location ~ ^/api/v1/ {
            limit_except GET {
                proxy_pass http://backend_write;
            }

            proxy_cache off;

            proxy_pass http://backend_read;  # GET с балансировкой
            add_header X-Upstream $upstream_addr always;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API v2 - Store Python (переписываем /api/v2 → /api/v1 на бэкенде)
        # Realtime endpoints must go to write instance (Kafka consumer lives there)
        location ^~ /api/v2/realtime/ {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;

            proxy_pass http://python_write/api/v1/realtime/;
            add_header X-Upstream $upstream_addr always;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /api/v2/socket.io/ {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            proxy_cache off;

            proxy_pass http://python_write/api/v1/socket.io/;
            add_header X-Upstream $upstream_addr always;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/api/v2/(.*)$ {
            # WebSocket / Socket.IO support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # SSE: disable buffering
            proxy_buffering off;

            limit_except GET {
                proxy_pass http://python_write/api/v1/$1$is_args$args;
            }

            proxy_cache off;

            proxy_pass http://python_read/api/v1/$1$is_args$args;  # GET с балансировкой
            add_header X-Upstream $upstream_addr always;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API - все остальные запросы к /api/ → на основной бэкенд
        location /api/ {
            rewrite ^/api/(.*)$ /api/v1/$1 break;

            limit_except GET {
                proxy_pass http://backend_write;
            }
            proxy_pass http://backend_read;
            proxy_set_header Host $host;
            add_header X-Upstream $upstream_addr always;
        }

        # Статика - кеширование для всех GET-запросов (кроме /api)
        location = /favicon.ico {
            try_files /favicon.svg =204;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ =404;

            # Кеширование для статики 
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # pgAdmin
        location /admin/ {
            proxy_cache off;

            proxy_pass http://pgadmin:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Script-Name /admin;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # Photo-service (to avoid mixed-content when UI is opened via HTTPS)
        location ^~ /photo-service/ {
            proxy_pass http://photo-service:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache off;
        }
    }
}